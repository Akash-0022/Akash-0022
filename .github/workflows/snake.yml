name: Generate Gold Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Generate Gold Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Akash-0022
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D49A2A&color_dots=%230B1F4B,%23152D65,%232A4A8A,%23A87520,%23D49A2A
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23D49A2A&color_dots=%230B1F4B,%23152D65,%232A4A8A,%23A87520,%23D49A2A

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
