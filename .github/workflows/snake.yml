name: Generate Purple Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Purple Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: vijay-011
          outputs: |
            dist/github-snake.svg?color_snake=%23E0AAFF&color_dots=%232E0854,%234C1D95,%237B2CBF,%23B57EDC,%23E0AAFF
            dist/github-snake-dark.svg?color_snake=%23FFFFFF&color_dots=%232E0854,%234C1D95,%237B2CBF,%23B57EDC,%23E0AAFF

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
