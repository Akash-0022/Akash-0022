name: Generate Blue Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Generate Blue Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Akash-0022
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300BFFF&color_dots=%230A192F,%231B3A5B,%230062A8,%230078D4,%2300BFFF
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300BFFF&color_dots=%230A192F,%231B3A5B,%230062A8,%230078D4,%2300BFFF

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
